server:
  port: 8080

client:
  payment:
    url: http://payment-ms:8081
  product:
    url: http://product-ms:8082

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  profiles:
    active: local