plugins {
    id "java"
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "${dependencyManagementVersion}"
    id "groovy"
}

group = "az.ingress"
sourceCompatibility = JavaVersion.toVersion("${javaVersion}")

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    // Swagger
    implementation "org.springdoc:springdoc-openapi-ui:${openApiVersion}"

    // Testing
    testImplementation "org.apache.groovy:groovy:${groovyVersion}"
    testImplementation "io.github.benas:random-beans:${randomBeansVersion}"
    testImplementation "org.spockframework:spock-spring:${spockSpringVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    // Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Database
    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

    // ShedLock
    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedLockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedLockJdbcTemplateVersion}"
}

test {
    useJUnitPlatform()
}
