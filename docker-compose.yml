version: '3.9'

services:
  postgres-db:
    image: postgres:16
    container_name: subscription_postgres
    restart: always
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: